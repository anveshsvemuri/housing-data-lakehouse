[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "housing-data-lakehouse"
version = "0.1.0"
description = "A reproducible medallion lakehouse pipeline for housing analytics"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pyspark>=3.5,<4",
]

[project.scripts]
housing-lakehouse = "housing_lakehouse.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
